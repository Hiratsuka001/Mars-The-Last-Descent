<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="marsGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="60%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#7c2d12"/>
    </radialGradient>
  </defs>
  <!-- Background Space -->
  <rect width="32" height="32" rx="7" fill="#04060d"/>
  <!-- Planet Mars -->
  <circle cx="16" cy="16" r="11" fill="url(#marsGrad)"/>
  <!-- Craters -->
  <circle cx="12" cy="13" r="2.2" fill="#7c2d12" opacity="0.6"/>
  <circle cx="19" cy="19" r="1.8" fill="#7c2d12" opacity="0.6"/>
  <circle cx="21" cy="12" r="1.2" fill="#7c2d12" opacity="0.5"/>
  <!-- Landed Spacecraft Capsule / Satellite Pin -->
  <path d="M16 7 L18 11 L14 11 Z" fill="#f8fafc"/>
  <rect x="15" y="11" width="2" height="2" fill="#38bdf8"/>
  <line x1="14" y1="13" x2="12" y2="15" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="18" y1="13" x2="20" y2="15" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="16" y1="13" x2="16" y2="15" stroke="#cbd5e1" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Beacon pulse dot -->
  <circle cx="16" cy="6" r="1" fill="#38bdf8"/>
</svg>

